# ไฟล์นี้มีผลเฉพาะเครื่องที่โคลนโค้ดโปรเจกต์มาเต็ม (ผู้พัฒนา / เครื่องที่ไม่มีอินเทอร์เน็ต)
# Docker Compose จะรวมไฟล์นี้เข้ากับ docker-compose.yml ให้อัตโนมัติเมื่อมันอยู่ข้างกัน
#
# ผล: `docker compose up -d --build` จะ build image จากโค้ดในโฟลเดอร์นี้ แทนการ pull จาก GHCR
#
# หน่วยบริการที่ดาวน์โหลดเฉพาะไฟล์ docker-compose.yml ไปไฟล์เดียว จะไม่ได้ไฟล์นี้
# จึงดึง image สำเร็จรูปจาก ghcr.io ตามปกติ — ไม่ต้องแก้อะไร

services:
  13file-tools:
    build: .
