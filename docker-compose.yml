# 13File Tools — รันด้วย Docker
#
# ติดตั้งครั้งแรก:   docker compose up -d
# อัปเดตเวอร์ชันใหม่: docker compose pull && docker compose up -d
# ดู log:            docker compose logs -f
#
# ค่าตั้งของหน่วยบริการ (data/dbconfig.json, data/.session-secret) เก็บในโฟลเดอร์
# ./data ข้างไฟล์นี้ — อัปเดต image กี่ครั้งค่าตั้งก็ไม่หาย

services:
  13file-tools:
    # image สำเร็จรูปที่ GitHub Actions build ให้ตอนออกเวอร์ชัน — หน่วยบริการใช้ไฟล์นี้
    # ไฟล์เดียวก็ติดตั้งได้ ไม่ต้องมีโค้ด/Node ในเครื่อง
    # ตรึงเวอร์ชันได้โดยเปลี่ยน latest เป็นเลขเวอร์ชัน เช่น :1.1.0
    image: ghcr.io/tankitkitty/13filetools:latest
    # หมายเหตุสำหรับผู้พัฒนา: ถ้าโคลนโปรเจกต์เต็มมา จะมีไฟล์ docker-compose.override.yml
    # ที่สั่ง build จากโค้ดในเครื่องให้อัตโนมัติ (Docker Compose รวมไฟล์ override ให้เอง)
    container_name: 13file-tools
    restart: unless-stopped
    ports:
      # เปลี่ยนพอร์ตฝั่งเครื่อง host ได้โดยสร้างไฟล์ .env ข้างไฟล์นี้ ใส่ APP_PORT=3013
      # (ค่าเริ่มต้น 3000)
      - "${APP_PORT:-3000}:3000"
    environment:
      - TZ=Asia/Bangkok
      # ตั้งค่า MySQL ผ่าน env ก็ได้ (มีผลเหนือ data/dbconfig.json) — ปกติไม่ต้อง
      # ใช้หน้า /settings ตั้งค่าแล้วเก็บลง data/dbconfig.json สะดวกกว่า
      # - MYSQL_HOST=192.168.1.100
      # - MYSQL_PORT=3306
      # - MYSQL_USER=readonly13
      # - MYSQL_PASSWORD=
      # - MYSQL_DATABASE=hos
    volumes:
      # เก็บ dbconfig.json / dbconfig43.json / .session-secret ไว้นอก container
      - ./data:/app/data
      # ถ้าใช้ฟีเจอร์ซิงค์ NHSO และมีไฟล์ public key ให้เปิดคอมเมนต์บรรทัดนี้
      # - ./nhso-public-key.pem:/app/nhso-public-key.pem:ro
    # ตัวแปร NHSO_* สำหรับปุ่มซิงค์สถานะเคลม (ถ้าใช้) — สร้างไฟล์ .env.local แล้วเปิดคอมเมนต์
    # env_file:
    #   - .env.local
